[pytest]
testpaths = tests
asyncio_mode = auto

; One event loop for the whole session. The async engine and its asyncpg connections are
; bound to the loop that created them, so a per-test loop would hand every test after the
; first a pool of connections belonging to a loop that is already closed.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning:passlib.*
